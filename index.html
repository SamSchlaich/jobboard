<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>3X Job Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --red:#EF1A2D; --red-ink:#C4101F; --ink:#0A0A0A;
    --bg:#F3F3F5; --surface:#FFFFFF; --surface-2:#F8F8FA; --line:#E3E3E8; --line-2:#D3D3DA;
    --text:#18181B; --muted:#6E6E78; --faint:#A0A0AA;
    --good:#1B7A3A; --good-bg:#E6F4EA; --warn:#B45309; --warn-bg:#FEF3E2; --bad:#B91C1C;
    --band:#0A0A0A; --band-text:#FAFAFA; --band-sub:#B8B8C0; --band-done:#123D22;
    --chip:#ECECF0; --shadow:0 1px 2px rgba(10,10,10,.06), 0 4px 14px rgba(10,10,10,.05);
    --focus:#0A0A0A;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111114; --surface:#1B1B1F; --surface-2:#232328; --line:#2B2B31; --line-2:#3A3A42;
      --text:#F2F2F4; --muted:#A2A2AC; --faint:#6C6C76;
      --good:#5CC27A; --good-bg:#15301E; --warn:#F2B04C; --warn-bg:#3A2A10; --bad:#F26B6B;
      --band:#000000; --band-text:#FAFAFA; --band-sub:#9C9CA6; --band-done:#0F2E1A; --chip:#2A2A30;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); --focus:#FFFFFF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#111114; --surface:#1B1B1F; --surface-2:#232328; --line:#2B2B31; --line-2:#3A3A42;
    --text:#F2F2F4; --muted:#A2A2AC; --faint:#6C6C76;
    --good:#5CC27A; --good-bg:#15301E; --warn:#F2B04C; --warn-bg:#3A2A10; --bad:#F26B6B;
    --band:#000000; --band-text:#FAFAFA; --band-sub:#9C9CA6; --band-done:#0F2E1A; --chip:#2A2A30;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); --focus:#FFFFFF;
    color-scheme: dark;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Barlow', -apple-system, 'Segoe UI', Arial, sans-serif; font-size:15px; line-height:1.4; overscroll-behavior-y:none; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; min-height:44px; }
  h1,h2,h3 { margin:0; font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; text-wrap:balance; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  :focus-visible { outline:2px solid var(--red); outline-offset:2px; }
  button, .jobcard, .band, .step, .pickitem, .rowitem, .carchip, .tab, .choice, .stat { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .btn, .tbtn, .choice, .pickitem, .rowitem, .stat, .phasebtn, .notebtn, .carchip, .reasons button, .sw-actions button, .actionbar button { transition:transform .08s ease, filter .08s ease, opacity .08s ease; }
  .btn:active, .tbtn:active, .choice:active, .pickitem:active, .reasons button:active, .actionbar button:active, .phasebtn:active, .notebtn:active, .carchip:active, .sw-actions button:active { transform:scale(.97); filter:brightness(.92); }
  .rowitem:active, .stat:active, .band:active { filter:brightness(.9); }
  .jobcard:active { filter:brightness(.94); }
  .main.enter { animation:screenIn .18s ease-out; }
  @keyframes screenIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
  .main.enter-back { animation:screenBack .18s ease-out; }
  @keyframes screenBack { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }

  /* ---------- app frame ---------- */
  #app { display:flex; flex-direction:column; height:100dvh; }
  #app > * { flex-shrink:0; }
  .topbar { background:var(--ink); color:#FAFAFA; padding:calc(10px + var(--safe-t)) 14px 10px; }
  .topbar .brand { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:800; font-size:12px; letter-spacing:.16em; }
  .topbar .row.top, .jobtop .row.top { min-height:40px; margin-bottom:2px; }
  .backbtn { display:inline-flex; align-items:center; gap:4px; background:none; border:none; color:#FAFAFA; font-weight:700; font-size:15px; padding:6px 10px 6px 0; min-height:40px; margin-left:-2px; }
  .backbtn span { font-size:26px; line-height:1; color:var(--red); margin-top:-3px; }
  .topbar .brand b { color:var(--red); }
  .topbar .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .topbar h1 { font-size:22px; font-weight:700; letter-spacing:.01em; line-height:1.1; margin-top:2px; }
  .topbar .sub { color:#A9A9B3; font-size:12.5px; margin-top:2px; }
  .topbar .tbtn { background:#232328; color:#FAFAFA; border:1px solid #33333A; border-radius:8px; padding:6px 12px; font-weight:600; font-size:13px; white-space:nowrap; min-height:40px; }
  .topbar .who { display:inline-flex; align-items:center; gap:6px; background:#232328; border:1px solid #33333A; border-radius:999px; padding:3px 10px 3px 4px; font-size:12.5px; font-weight:600; color:#D6D6DC; }
  .topbar .who i { width:22px; height:22px; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-style:normal; font-weight:800; font-size:11px; }
  .main { flex:1 1 auto !important; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 12px calc(96px + var(--safe-b)); }
  .main.noscroll { overflow:hidden; padding:0; display:flex; flex-direction:column; }
  .actionbar { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:10px 12px calc(10px + var(--safe-b)); display:flex; gap:10px; z-index:20; }
  .actionbar button { flex:1; padding:13px 12px; border:none; border-radius:10px; font-size:15px; font-weight:700; background:var(--chip); color:var(--text); }
  .actionbar button.primary { background:var(--red); color:#fff; }
  .actionbar button.narrow { flex:0 0 auto; padding-inline:16px; }

  /* ---------- generic ---------- */
  .card { background:var(--surface); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .stack { display:flex; flex-direction:column; gap:12px; }
  .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field label { font-size:12.5px; font-weight:600; color:var(--muted); }
  .field input, .field select, .field textarea { width:100%; min-width:0; max-width:100%; padding:11px 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--surface); font-size:16px; -webkit-appearance:none; appearance:none; min-height:46px; }
  .field select { background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px; }
  .field textarea { min-height:84px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width: 440px) { .grid2 { grid-template-columns:1fr; } }
  .btn { padding:12px 14px; border:none; border-radius:10px; font-weight:700; font-size:15px; background:var(--chip); color:var(--text); }
  .btn.primary { background:var(--red); color:#fff; }
  .btn.ghost { background:transparent; border:1px solid var(--line-2); }
  .btn.small { padding:8px 12px; font-size:13px; border-radius:8px; min-height:44px; }
  .btn.danger { color:var(--bad); }
  .btn:disabled { opacity:.45; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .pill.good { background:var(--good-bg); color:var(--good); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.dark { background:var(--ink); color:#fff; }
  .sect-title { display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 8px; }
  .sect-title h2 { font-size:19px; font-weight:700; letter-spacing:.02em; }
  .empty { padding:26px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .toast { position:fixed; left:50%; bottom:calc(104px + var(--safe-b)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px; z-index:60; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; text-align:center; }
  .toast.show { opacity:1; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .choice { padding:9px 12px; border-radius:9px; border:1px solid var(--line-2); background:var(--surface); font-weight:600; font-size:14px; text-align:left; }
  .choice.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .choice small { display:block; font-weight:500; font-size:11.5px; color:var(--muted); }
  .choice.on small { color:#B8B8C0; }
  .hint { color:var(--muted); font-size:12.5px; text-align:center; padding:6px 10px 0; font-style:italic; }
  .pick { width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--surface); font-size:16px; color:var(--faint); min-height:46px; }
  .pick.set { color:var(--text); font-weight:600; }
  .pick:disabled { opacity:.5; }
  .pick .chev { color:var(--muted); font-size:13px; }
  .pickq { width:100%; padding:12px; border:1px solid var(--line-2); border-radius:10px; background:var(--surface-2); font-size:17px; min-height:48px; margin-bottom:8px; }
  .picklist { max-height:52dvh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .pickitem { text-align:left; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--surface); min-height:48px; }
  .pickitem b { display:block; font-size:15.5px; }
  .pickitem small { color:var(--muted); font-size:12px; }
  .pickitem.new { border-color:var(--red); } .pickitem.new b { color:var(--red); }
  .kvrow { display:grid; grid-template-columns:96px 1fr; gap:8px; font-size:14.5px; padding:4px 0; border-bottom:1px solid var(--line); }
  .kvrow:last-of-type { border-bottom:none; }
  .kvrow b { color:var(--muted); font-weight:600; font-size:13px; }
  .warnbar { background:var(--warn-bg); color:var(--warn); padding:10px 14px; font-size:13px; font-weight:600; border-bottom:1px solid var(--line); }

  /* ---------- sheets (replace browser pop-ups) ---------- */
  .sheetwrap { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-end; animation:dimIn .18s ease-out; }
  .sheetwrap.out { animation:dimOut .16s ease-in forwards; }
  .sheetwrap.out .sheet { animation:sheetOut .16s ease-in forwards; }
  @keyframes dimIn { from { background:rgba(0,0,0,0); } to { background:rgba(0,0,0,.55); } }
  @keyframes dimOut { to { background:rgba(0,0,0,0); } }
  .sheet { background:var(--bg); width:100%; max-height:88dvh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; animation:sheetIn .22s cubic-bezier(.2,.8,.2,1); }
  .sheet::before { content:""; display:block; width:38px; height:4px; border-radius:2px; background:var(--line-2); margin:8px auto -4px; }
  @keyframes sheetIn { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes sheetOut { to { transform:translateY(100%); } }
  .sheet .sh { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 10px; }
  .sheet .sh h2 { font-size:21px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
  .sheet .sb { overflow-y:auto; padding:0 12px calc(16px + var(--safe-b)); }
  .notegroup { background:var(--surface); border-radius:12px; box-shadow:var(--shadow); padding:12px 13px; margin-bottom:12px; }
  .notegroup h3 { font-size:17px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; margin-bottom:8px; }
  .notegroup h3 em { color:var(--red); font-style:normal; }
  .noteline { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .noteline:first-of-type { border-top:none; }
  .noteline .w { flex:0 0 auto; color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; margin-top:1px; }
  .noteline .t { flex:1; min-width:0; }
  .noteline .t small { display:block; color:var(--faint); font-size:11.5px; }
  .noteline button { border:none; background:var(--chip); color:var(--muted); font-size:12px; font-weight:600; border-radius:6px; padding:2px 10px; min-height:32px; }
  .notegroup textarea { width:100%; min-height:72px; border:1px solid var(--line-2); border-radius:9px; padding:10px; font-size:16px; background:var(--surface-2); }
  .reasons { display:flex; flex-direction:column; gap:8px; }
  .reasons button { text-align:left; padding:12px 14px; border:1px solid var(--line-2); border-radius:10px; background:var(--surface); font-weight:600; font-size:15px; }
  .reasons button small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
  .sheetbtns { display:flex; gap:8px; margin-top:10px; }
  .sheetbtns .btn { flex:1; }
  .timein { width:100%; font-size:28px; font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; padding:10px 12px; border:1px solid var(--line-2); border-radius:10px; background:var(--surface); text-align:center; min-height:56px; }

  /* ---------- login ---------- */
  .login { max-width:420px; margin:0 auto; padding-top:8vh; }
  .login .mark { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:800; font-size:44px; letter-spacing:.06em; line-height:1; }
  .login .mark b { color:var(--red); }
  .login .tag { color:var(--muted); font-size:13px; margin:4px 0 22px; }
  .login .card { padding:18px 16px; }
  .err { color:var(--bad); font-size:13.5px; font-weight:600; min-height:18px; }

  /* ---------- home ---------- */
  .swipe { position:relative; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  .swipe .sw-actions { position:absolute; top:0; bottom:0; right:0; display:flex; }
  .swipe .sw-actions button { width:92px; border:none; color:#fff; font-weight:700; font-size:14px; font-family:'Barlow Condensed',Arial,sans-serif; letter-spacing:.04em; text-transform:uppercase; }
  .swipe .sw-actions .sw-done { background:var(--good); }
  .swipe .sw-actions .sw-del { background:var(--red); }
  .swipe .jobcard { position:relative; box-shadow:none; transition:transform .18s ease-out, filter .08s ease; touch-action:pan-y; will-change:transform; }
  .swipe.dragging .jobcard { transition:none; }
  .jobcard { display:block; width:100%; text-align:left; background:var(--surface); border:none; border-radius:12px; box-shadow:var(--shadow); padding:0; overflow:hidden; color:inherit; }
  .jobcard .jc-body { padding:12px 14px 10px; }
  .jobcard .jc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .jobcard h3 { font-size:21px; font-weight:700; letter-spacing:.01em; line-height:1.05; }
  .jobcard .jc-client { color:var(--muted); font-size:13.5px; margin-top:2px; }
  .jobcard .jc-lists { margin-top:8px; display:flex; flex-direction:column; gap:3px; font-size:13.5px; }
  .jobcard .jc-lists div { display:flex; justify-content:space-between; gap:8px; }
  .jobcard .jc-lists b { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; letter-spacing:.03em; text-transform:uppercase; font-size:13px; }
  .jobcard .jc-lists .st { color:var(--muted); }
  .jobcard .jc-lists .st.paused { color:var(--warn); font-weight:600; }
  .jobcard .jc-lists .st.done { color:var(--good); font-weight:600; }
  .jobcard .jc-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .jobcard .bar { height:5px; background:var(--chip); }
  .jobcard .bar i { display:block; height:100%; background:var(--red); transition:width .25s; }
  .jobcard.done .bar i { background:var(--good); }
  .statrow { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:var(--surface); border-radius:10px; padding:10px 12px; box-shadow:var(--shadow); border:2px solid transparent; text-align:left; }
  .stat.on { border-color:var(--focus); }
  .stat .v { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; font-size:26px; line-height:1; }
  .stat .k { font-size:11.5px; color:var(--muted); margin-top:3px; }

  /* ---------- job screen ---------- */
  .jobtop { background:var(--ink); color:#FAFAFA; padding:calc(8px + var(--safe-t)) 14px 8px; }
  .jobtop .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .jobtop .brand { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:800; font-size:12px; letter-spacing:.16em; }
  .jobtop .brand b { color:var(--red); }
  .jobtop .tbtn { background:#232328; color:#FAFAFA; border:1px solid #33333A; border-radius:8px; padding:6px 12px; font-weight:600; font-size:13px; white-space:nowrap; min-height:40px; }
  .jobtop h1 { font-size:22px; font-weight:700; line-height:1.05; margin-top:4px; }
  .jobtop .sub { color:#A9A9B3; font-size:12.5px; margin-top:1px; }
  .carchips { display:flex; gap:8px; overflow-x:auto; padding:6px 0 2px; scrollbar-width:none; }
  .carchips::-webkit-scrollbar { display:none; }
  .carchip { flex:0 0 auto; border-radius:9px; padding:7px 12px; background:#232328; color:#D6D6DC; border:1px solid #33333A; font-weight:700; font-size:15px; white-space:nowrap; line-height:1.2; min-height:38px; font-family:'Barlow Condensed',Arial,sans-serif; letter-spacing:.02em; }
  .carchip.on { background:#fff; color:var(--ink); border-color:#fff; }
  .carchip.on i { color:var(--red); font-style:normal; }
  .carchip small { font-family:'Barlow',sans-serif; font-weight:500; font-size:11.5px; opacity:.75; margin-left:4px; }
  .stats { display:flex; gap:6px; margin-top:8px; }
  .stats .st { flex:1; background:#1A1A1E; border:1px solid #2C2C33; border-radius:8px; padding:5px 9px; min-width:0; display:flex; flex-direction:column; justify-content:center; min-height:44px; text-align:left; color:#FAFAFA; }
  .stats .st .k { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#8E8E99; font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; line-height:1; }
  .stats .st .v { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; font-size:18px; line-height:1.1; margin-top:2px; white-space:nowrap; }
  .stats .st .v.red { color:var(--red); }
  .tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--line); }
  .tab { flex:1; padding:9px 6px 0; border:none; background:none; text-align:center; color:var(--faint); min-height:0; }
  .tab .t { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; font-size:17px; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; }
  .tab .p { font-size:11.5px; margin-top:0; }
  .tab .p.paused { color:var(--warn); font-weight:700; }
  .tab .ul { height:4px; margin-top:6px; background:transparent; border-radius:2px 2px 0 0; }
  .tab.on { color:var(--text); }
  .tab.on .ul { background:var(--red); }
  .panes { flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .panes::-webkit-scrollbar { display:none; }
  .pane { flex:0 0 100%; scroll-snap-align:start; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px calc(96px + var(--safe-b)); }
  .panehead { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:2px 4px 6px; }
  .panehead .eyebrow { color:var(--red); margin-bottom:1px; }
  .panehead h2 { font-size:22px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; line-height:1; }
  .panehead .c { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; font-size:15px; color:var(--muted); white-space:nowrap; text-align:right; }
  .clockline { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 4px 10px; font-size:13.5px; font-weight:600; }
  .clockline .cl b { font-family:'Barlow Condensed',Arial,sans-serif; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:14px; margin-right:6px; }
  .clockline.running .cl b { color:var(--good); }
  .clockline.paused { color:var(--warn); } .clockline.paused .cl b { color:var(--warn); }
  .clockline.idle .cl { color:var(--muted); }
  .clockline .btn.small { min-height:44px; padding:6px 14px; }

const userName = id => (DB.users.find(u => u.id === id) || {}).name || "—";

    S.phases.forEach((ph, pi) => { const g = L.flags[pi+"_g"]; if (g) out.push({ where:`${S.title} · ${ph[0]}`, what:g, step:"(phase note)", kind:"step", code, k:pi+"_g" });
      ph[3].forEach((txt, ii) => { const f = L.flags[pi+"_"+ii]; if (f) out.push({ where:`${S.title} · ${ph[0]}`, what:f, step:txt, kind:"step", code, k:pi+"_"+ii }); }); });

// --- shared setup: one Unload & Setup per stop, same client ---
const SHARED_PHASE = "UNLOAD & SETUP"; const CLOSEOUT_PHASE = "VEHICLE SECURING & SITE CLOSE-OUT";

const closeoutIndex = code => LISTS[code].phases.findIndex(p => p[1] === CLOSEOUT_PHASE);
function markCloseoutEverywhere(ts, job){ // one securing & close-out per car: marks it on this car's other checklists
  let n = 0; jobLists(job).forEach(c => { const ci = closeoutIndex(c); if (ci >= 0 && !job.lists[c].phases[ci]) { job.lists[c].phases[ci] = ts; n++; } }); return n;
}
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function sameClient(a, b){ const x = normName(a), y = normName(b); if (!x || !y) return false; if (x === y) return true; const fx = x.split(" ")[0], fy = y.split(" ")[0]; return fx.length >= 3 && fx === fy; }
function markSetupEverywhere(ts, job){ let n = 0; DB.jobs.filter(j => j.status === "active" && j.arrivedAt && j.date === job.date && (j.id === job.id || sameClient(j.client, job.client))).forEach(j => jobLists(j).forEach(c => { if (hasSharedSetup(c) && !j.lists[c].phases[0]) { j.lists[c].phases[0] = Math.max(ts, j.arrivedAt); n++; } })); return n; }
function adoptSetup(job){

}

// ---------- share text ----------
function summaryText(job){
  const L = [`3X JOB · ${fmtDate(job.date)}`, `${job.client} · ${job.vehicle}`, `Service: ${jobServiceNames(job).join(" + ")}`,
    `Arrived ${fmtT(job.arrivedAt)} · Finished ${fmtT(job.finishedAt)} · ${fmtD(jobTotal(job))} on site`,
    `Lead: ${userName(job.leadId)}${job.techIds.length ? " · Tech: " + job.techIds.map(userName).join(", ") : ""}`];
  if (job.finishNote) L.push(`⚑ Finished with open phases: ${job.finishNote}`);
  const clocks = jobLists(job).map(code => { const p = listPausedTotal(job, code); return `${LISTS[code].title} ${fmtD(listActiveTotal(job, code))} active${p ? ` (paused ${fmtD(p)})` : ""}`; }); if (clocks.length) L.push(`Checklists: ${clocks.join(" · ")}`);
  const ov = overruns(job); if (ov.length) { L.push(""); L.push("RAN LONG"); ov.forEach(o => L.push(`• ${LISTS[o.code].title} ${o.ph[0]} ${o.ph[1]}: ${fmtD(o.s.duration)} (target ~${o.s.target}m)`)); }
  const notes = allNotes(job); if (notes.length) { L.push(""); L.push("NOTES"); notes.forEach(n => L.push(`• ${n.where}: ${n.what}`)); } else { L.push(""); L.push("No notes."); }
  const pauses = jobLists(job).flatMap(code => listPauses(job, code).map(p => `• ${LISTS[code].title} paused ${fmtT(p.from)}–${p.open ? "…" : fmtT(p.to)} (${fmtD(p.ms)})${p.reason ? ": " + p.reason : ""}`)); if (pauses.length) { L.push(""); L.push("PAUSES"); pauses.forEach(x => L.push(x)); }
  return L.join("\n");
}
function fullText(job){
  const L = [summaryText(job), "", "PHASE TIMING (active time only)"];
  jobLists(job).forEach(code => { const S = LISTS[code]; const st = phaseStats(job, code); const p = listProgress(job, code); const pauses = listPauses(job, code);
    L.push(""); L.push(`${S.title.toUpperCase()} — ${p.d} of ${p.t} phases · ${fmtD(listActiveTotal(job, code))} active · ${fmtD(listPausedTotal(job, code))} paused`);
    S.phases.forEach((ph, pi) => { const s = st[pi]; L.push(` ${ph[0]} ${ph[1]} — ${s.complete ? `${fmtT(s.startAt)}→${fmtT(s.endAt)} (${fmtD(s.duration)}${s.target ? ` / ~${s.target}m` : ""})${s.over ? " RAN LONG" : ""}` : "NOT DONE"}`);
      pausesInPhase(pauses, st, pi).forEach(p => L.push(`   ❚❚ paused ${fmtT(p.from)}–${p.open ? "…" : fmtT(p.to)} (${fmtD(p.ms)}): ${p.reason || "no reason given"}`)); });
    pausesInPhase(pauses, st, -1).forEach(p => L.push(` ❚❚ paused after last phase ${fmtT(p.from)}–${p.open ? "…" : fmtT(p.to)} (${fmtD(p.ms)}): ${p.reason || "no reason given"}`)); });
  return L.join("\n");
}

// Edge swipe (from the left edge, rightwards) = one app step back. Handled in-app; no browser history is used, so Safari never shows its blank snapshot.

function animateScroll(el, to, ms){ // glide inside a pane
  const from = el.scrollTop; const max = el.scrollHeight - el.clientHeight; to = Math.max(0, Math.min(max, to)); const d = to - from; if (Math.abs(d) < 2) return;

let openSwipe = null;
function wireSwipes(){ // slide a job card left to reveal Complete / Delete
  app.querySelectorAll(".swipe").forEach(sw => {
    const card = sw.querySelector(".jobcard"); const W = +sw.dataset.w || 0; if (!W) return;
    let x0 = 0, y0 = 0, dx = 0, open = false, dragging = false, axis = null;
    const setX = v => { card.style.transform = `translateX(${v}px)`; };
    const close = () => { open = false; setX(0); if (openSwipe === close) openSwipe = null; };
    card.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; dx = 0; axis = null; dragging = false; });
    card.addEventListener("pointermove", e => {
      if (!e.buttons && e.pointerType === "mouse") return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!axis) { if (Math.abs(mx) < 8 && Math.abs(my) < 8) return; axis = Math.abs(mx) > Math.abs(my) ? "x" : "y"; if (axis === "x") { dragging = true; sw.classList.add("dragging"); if (openSwipe && openSwipe !== close) openSwipe(); try { card.setPointerCapture(e.pointerId); } catch(_){} } }
      if (axis !== "x") return; e.preventDefault();
      dx = Math.max(-W - 20, Math.min(0, (open ? -W : 0) + mx)); setX(dx);
    });
    const end = () => { sw.classList.remove("dragging"); if (!dragging) { if (open) { close(); } return; } open = dx < -W / 2; setX(open ? -W : 0); if (open) openSwipe = close; setTimeout(() => { dragging = false; }, 0); };
    card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
    card.addEventListener("click", e => { if (dragging || open) { e.stopImmediatePropagation(); e.preventDefault(); if (open && !dragging) close(); } }, true);
  });
  app.querySelectorAll("[data-swdone]").forEach(b => b.onclick = () => { const job = DB.jobs.find(j => j.id === b.dataset.swdone); if (job) finishJob(job); });
  app.querySelectorAll("[data-swdel]").forEach(b => b.onclick = () => { const job = DB.jobs.find(j => j.id === b.dataset.swdel); if (!job) return; confirmSheet({ title:`Delete ${esc(job.vehicle)}?`, text:`${esc(job.client)} · ${fmtDate(job.date)}. The job and its timing are removed for everyone. This cannot be undone.`, ok:"Delete job", danger:true, onOk: () => { deleteJob(job.id); toast("Deleted"); render(); } }); });
}

const CADENCES = [["", "No schedule"], ["7", "Weekly"], ["14", "Every 2 weeks"], ["30", "Monthly"], ["60", "Every 2 months"], ["90", "Quarterly"], ["180", "Every 6 months"]];
const canEditClients = () => { const r = (me() || {}).role; return r === "owner" || r === "lead"; };
function clientLastVisit(c){ // latest of the stored date and any job on the board for this client
  let last = c.lastVisit || ""; DB.jobs.filter(j => sameClient(j.client, c.name) && j.status === "done").forEach(j => { if (j.date > last) last = j.date; }); return last;
}
function clientNextDue(c){ if (c.nextDue) return c.nextDue; const cad = +c.cadenceDays || 0; const last = clientLastVisit(c); if (!cad || !last) return ""; const [y,m,d] = last.split("-"); const dt = new Date(+y, +m-1, +d + cad); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function dueState(c){ const nd = clientNextDue(c); if (!nd) return null; const days = Math.round((new Date(nd) - new Date(todayISO())) / 86400000); return { date:nd, days, cls: days < 0 ? "bad" : days <= 7 ? "warn" : "good", text: days < 0 ? `${-days}d overdue` : days === 0 ? "due today" : `due in ${days}d` }; }
function renderClients(){
  const q = ui.clientQ.trim().toLowerCase(); const words = q.split(/\s+/).filter(Boolean);
  const all = [...DB.clients].sort((a,b) => a.name.localeCompare(b.name));
  const hits = all.filter(c => !q || words.every(w => c.name.toLowerCase().split(/[^a-z0-9]+/).some(p => p.startsWith(w))) || (c.vehicles || []).some(v => v.toLowerCase().includes(q)));
  const due = all.map(c => ({ c, d:dueState(c) })).filter(x => x.d && x.d.days <= 14).sort((a,b) => a.d.days - b.d.days);
  const row = c => { const d = dueState(c); return `<button class="rowitem" data-client="${c.id}"><div style="min-width:0"><div class="n">${esc(c.name)}${d ? ` <span class="pill ${d.cls}">${esc(d.text)}</span>` : ""}</div><div class="s">${(c.vehicles || []).length ? esc((c.vehicles || []).slice(0,3).join(" · ")) + ((c.vehicles || []).length > 3 ? ` · +${c.vehicles.length - 3}` : "") : "no vehicles on file"}${c.phone ? ` · ${esc(c.phone)}` : ""}</div></div><span class="chev" style="color:var(--muted)">›</span></button>`; };
  app.innerHTML = topbar("Clients", `${all.length} on file · ${canEditClients() ? "tap one to view or edit" : "tap one to view"}`, "") +
   `<div class="main"><div class="stack">
     <input class="pickq" id="cq" placeholder="Search by name or car…" value="${esc(ui.clientQ)}" autocomplete="off">
     ${!q && due.length ? `<div class="sect-title"><h2>Coming due</h2><span class="pill">${due.length}</span></div><div class="card">${due.map(x => row(x.c)).join("")}</div><div class="sect-title"><h2>All clients</h2></div>` : ""}
     <div class="card">${hits.map(row).join("") || `<div class="empty">${q ? "No client matches that." : "No clients yet."}</div>`}</div>
     ${canEditClients() ? `<button class="btn ghost" id="c_new">＋ New client</button>` : ""}
   </div></div>`;
  wireNav(); const cq = $("#cq"); cq.oninput = () => { ui.clientQ = cq.value; const pos = cq.selectionStart; redraw(renderClients); const n = $("#cq"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("[data-client]").forEach(b => b.onclick = () => go("client", { clientId:b.dataset.client, clientEdit:false }));
  const nb = $("#c_new"); if (nb) nb.onclick = () => textSheet({ title:"New client", placeholder:"Full name", saveLabel:"Create", onSave: async name => { const id = slug(name) + "-" + Date.now().toString(36).slice(-3); const nc = { id, name:name.trim(), phone:"", vehicles:[], source:"app", createdAt:Date.now() }; DB.clients.push(nc); try { await setDoc(doc(fdb, "clients", id), nc); go("client", { clientId:id, clientEdit:true }); } catch(e){ toast("Could not save: " + (e.code || e.message)); } } });
}
function renderClient(){
  const c = DB.clients.find(x => x.id === ui.clientId); if (!c) return go("clients");
  const edit = ui.clientEdit && canEditClients(); const d = dueState(c); const last = clientLastVisit(c);
  const jobs = DB.jobs.filter(j => sameClient(j.client, c.name)).sort((a,b) => (b.date > a.date ? 1 : -1)).slice(0, 8);
  const f = (label, id, val, ph, type) => `<div class="field"><label>${label}</label><input id="${id}" value="${esc(val || "")}" placeholder="${esc(ph || "")}" ${type ? `type="${type}"` : ""} autocomplete="off"></div>`;
  const view = (label, val) => val ? `<div class="kvrow"><b>${label}</b><span>${esc(val)}</span></div>` : "";
  app.innerHTML = topbar(c.name, [c.phone, last ? "last visit " + fmtDate(last) : "no visits yet"].filter(Boolean).join(" · "), "") +
   `<div class="main"><div class="stack">
    ${d ? `<div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">Next detail</div><div style="font-family:'Barlow Condensed';font-weight:700;font-size:22px">${fmtDate(d.date)}</div></div><span class="pill ${d.cls}" style="font-size:13px">${esc(d.text)}</span></div>` : ""}
    ${edit ? `<div class="card" style="padding:14px"><div class="stack">
      ${f("Client name", "c_name", c.name)}${f("Phone", "c_phone", c.phone, "", "tel")}${f("Address", "c_addr", c.address, "Street, city")}
      ${f("Husband / wife / partner", "c_partner", c.partner, "Name and phone")}${f("Personal assistant / contact", "c_assist", c.assistant, "Name and phone")}
      <div class="grid2"><div class="field"><label>Maintenance schedule</label><select id="c_cad">${CADENCES.map(([v,l]) => `<option value="${v}" ${String(c.cadenceDays || "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></div><div class="field"><label>Next due (override)</label><input id="c_due" type="date" value="${esc(c.nextDue || "")}"></div></div>
      ${f("Last visit", "c_last", c.lastVisit, "", "date")}
      <div class="field"><label>Notes</label><textarea id="c_notes" placeholder="Gate code, where the key goes, preferences, anything the crew should know…">${esc(c.notes || "")}</textarea></div>
      <div class="err" id="c_err"></div>
      <div class="grid2"><button class="btn primary" id="c_save">Save client</button><button class="btn ghost" id="c_cancel">Cancel</button></div>
    </div></div>` : `<div class="card" style="padding:12px 14px"><div class="stack" style="gap:6px">
      ${view("Phone", c.phone)}${view("Address", c.address)}${view("Partner", c.partner)}${view("Assistant", c.assistant)}${view("Schedule", (CADENCES.find(x => x[0] === String(c.cadenceDays || "")) || ["",""])[1] === "No schedule" ? "" : (CADENCES.find(x => x[0] === String(c.cadenceDays || "")) || ["",""])[1])}${view("Last visit", last ? fmtDate(last) : "")}${c.notes ? `<div class="kvrow"><b>Notes</b><span style="white-space:pre-wrap">${esc(c.notes)}</span></div>` : ""}
      ${!c.phone && !c.address && !c.partner && !c.assistant && !c.notes ? `<div style="color:var(--muted);font-size:13.5px">Nothing on file beyond the name and vehicles yet.</div>` : ""}
      ${canEditClients() ? `<button class="btn ghost" id="c_edit" style="margin-top:6px">Edit client details</button>` : ""}
    </div></div>`}
    <div class="sect-title"><h2>Vehicles</h2><span class="pill">${(c.vehicles || []).length}</span></div>
    <div class="card">${(c.vehicles || []).map((v, i) => `<div class="rowitem"><div class="n">${esc(v)}</div>${canEditClients() ? `<div style="display:flex;gap:6px"><button class="btn small ghost" data-vedit="${i}">Rename</button><button class="btn small ghost danger" data-vrm="${i}">Remove</button></div>` : ""}</div>`).join("") || `<div class="empty">No vehicles on file.</div>`}</div>
    ${canEditClients() ? `<button class="btn ghost" id="c_addv">＋ Add vehicle</button>` : ""}
    <div class="sect-title"><h2>Recent jobs</h2></div>
    ${jobs.length ? jobs.map(jobCard).join("") : `<div class="card empty">No jobs on the board for this client yet.</div>`}
   </div></div>`;
  wireNav();
  app.querySelectorAll("[data-job]").forEach(b => b.onclick = () => openJob(b.dataset.job)); wireSwipes();
  const save = async patch => { try { await updateDoc(doc(fdb, "clients", c.id), patch); Object.assign(c, patch); } catch(e){ toast("Could not save: " + (e.code || e.message)); throw e; } };
  const eb = $("#c_edit"); if (eb) eb.onclick = () => { ui.clientEdit = true; redraw(renderClient); };
  if (edit) {
    $("#c_cancel").onclick = () => { ui.clientEdit = false; redraw(renderClient); };
    $("#c_save").onclick = async () => {
      const name = $("#c_name").value.trim(); if (!name) { $("#c_err").textContent = "Name is required."; return; }
      const patch = { name, phone:$("#c_phone").value.trim(), address:$("#c_addr").value.trim(), partner:$("#c_partner").value.trim(), assistant:$("#c_assist").value.trim(), cadenceDays: +$("#c_cad").value || null, nextDue:$("#c_due").value || "", lastVisit:$("#c_last").value || (c.lastVisit || ""), notes:$("#c_notes").value.trim() };
      const old = c.name; try { await save(patch); } catch(e){ return; }
      if (old !== name) { const affected = DB.jobs.filter(j => j.client === old); affected.forEach(j => { j.client = name; saveJob(j); }); if (affected.length) toast(`Renamed on ${affected.length} job${affected.length === 1 ? "" : "s"} too`); }
      ui.clientEdit = false; toast("Saved"); redraw(renderClient);
    };
  }
  app.querySelectorAll("[data-vedit]").forEach(b => b.onclick = () => { const i = +b.dataset.vedit; textSheet({ title:"Rename vehicle", value:c.vehicles[i], onSave: async v => { const vs = [...c.vehicles]; if (v) vs[i] = v; else vs.splice(i, 1); await save({ vehicles:vs }); redraw(renderClient); } }); });
  app.querySelectorAll("[data-vrm]").forEach(b => b.onclick = () => { const i = +b.dataset.vrm; confirmSheet({ title:"Remove vehicle?", text:`${esc(c.vehicles[i])} comes off ${esc(c.name)}'s file. Past jobs keep it.`, ok:"Remove", danger:true, onOk: async () => { const vs = [...c.vehicles]; vs.splice(i, 1); await save({ vehicles:vs }); redraw(renderClient); } }); });
  const av = $("#c_addv"); if (av) av.onclick = () => textSheet({ title:"Add vehicle", placeholder:"Make and model, e.g. Porsche 911 GT3", saveLabel:"Add", onSave: async v => { await save({ vehicles:[...(c.vehicles || []), v] }); redraw(renderClient); } });
}

// ---------- team (accounts live in the shared database) ----------
async function createCrewAccount(name, username, role, pw){ // owner creates a sign-in for someone else without leaving their own session
  const { initializeApp: init2 } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
  const { getAuth: getAuth2, createUserWithEmailAndPassword: create2, signOut: out2 } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
  const app2 = init2(firebaseConfig, "crew-" + Date.now()); const auth2 = getAuth2(app2);
  const existing = await getDoc(doc(fdb, "usernames", username)); const n = existing.exists() ? (existing.data().n || 1) + 1 : 1;
  const email = authEmailFor(username, n);
  const cred = await create2(auth2, email, pw); const uidv = cred.user.uid; await out2(auth2);
  return { uid:uidv, email, n };
}
function renderTeam(){
  if (!isOwner()) return go("home"); const ed = ui.editUser;
  const stats = u => { const led = DB.jobs.filter(j => j.status === "done" && j.leadId === u.id && jobTotal(j) != null); const worked = DB.jobs.filter(j => j.status === "done" && j.techIds.includes(u.id)).length; const avg = led.length ? led.reduce((a,j) => a + jobTotal(j), 0)/led.length : null; return `${led.length} led${worked ? ` · ${worked} as tech` : ""}${avg ? ` · ${fmtD(avg)} avg` : ""}`; };
  const users = DB.users.filter(u => u.active !== false);
  app.innerHTML = topbar("Team", "Same sign-in on every phone", "") +
   `<div class="main"><div class="stack"><div class="card">${users.map(u => `<div class="rowitem"><div><div class="n">${esc(u.name)} <span class="pill ${u.role === "owner" ? "dark" : ""}">${ROLES[u.role]}</span></div><div class="s">@${esc(u.username)} · ${stats(u)}</div></div><button class="btn small ghost" data-edit="${u.id}">${ed === u.id ? "Close" : "Edit"}</button></div>
        ${ed === u.id ? `<div class="editrow"><div class="stack"><div class="grid2"><div class="field"><label>Name</label><input id="e_name" value="${esc(u.name)}"></div><div class="field"><label>Role</label><select id="e_role" ${u.role === "owner" ? "disabled" : ""}>${Object.entries(ROLES).filter(([k]) => k !== "owner" || u.role === "owner").map(([k,v]) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${v}</option>`).join("")}</select></div></div><div class="field"><label>Username</label><input id="e_user" value="${esc(u.username)}" disabled></div><div class="err" id="e_err"></div><div class="grid2"><button class="btn primary" id="e_save">Save changes</button><button class="btn ghost" id="e_pw">Reset password</button></div>${u.role !== "owner" ? `<button class="btn ghost danger" id="e_rm">Remove ${esc(u.name.split(" ")[0])} from the team</button>` : ""}</div></div>` : ""}`).join("")}</div>
     <div class="sect-title"><h2>Add a team member</h2></div>
     <div class="card" style="padding:14px"><div class="stack"><div class="grid2"><div class="field"><label>Name</label><input id="t_name" placeholder="Joe Blow"></div><div class="field"><label>Role</label><select id="t_role"><option value="lead">Team Lead</option><option value="tech">Technician</option></select></div></div><div class="grid2"><div class="field"><label>Username</label><input id="t_user" autocapitalize="none" placeholder="joe"></div><div class="field"><label>Password</label><input id="t_pw" type="password" placeholder="6+ characters"></div></div><div class="err" id="t_err"></div><button class="btn primary" id="t_add">Add member</button></div></div>
     <div class="hint">Accounts are shared. Anyone you add can sign in on any phone with the app link.</div></div></div>`;
  wireNav(); app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { ui.editUser = ui.editUser === b.dataset.edit ? null : b.dataset.edit; redraw(renderTeam); });
  if (ed) { const u = DB.users.find(x => x.id === ed);
    $("#e_save").onclick = async () => { const name = $("#e_name").value.trim(), role = $("#e_role").value; if (!name) { $("#e_err").textContent = "Name is required."; return; } try { await updateDoc(doc(fdb, "users", u.id), { name, ...(u.role !== "owner" ? { role } : {}) }); u.name = name; if (u.role !== "owner") u.role = role; ui.editUser = null; toast("Saved"); redraw(renderTeam); } catch(e){ $("#e_err").textContent = authErr(e); } };
    $("#e_pw").onclick = () => textSheet({ title:`New password · ${esc(u.name)}`, placeholder:"At least 6 characters", saveLabel:"Set password", hint:"Sets a fresh sign-in for this username. Their old password stops working.", onSave: async pw => { if (pw.length < 6) { toast("Password needs 6+ characters"); return; } try { const r = await createCrewAccount(u.name, u.username, u.role, pw); const batch = writeBatch(fdb); batch.set(doc(fdb, "users", r.uid), { name:u.name, username:u.username, role:u.role, active:true, authEmail:r.email, createdAt:Date.now(), replaces:u.id }); batch.update(doc(fdb, "users", u.id), { active:false, replacedBy:r.uid }); batch.set(doc(fdb, "usernames", u.username), { uid:r.uid, authEmail:r.email, n:r.n }); await batch.commit(); DB.jobs.filter(j => j.leadId === u.id || j.techIds.includes(u.id)).forEach(j => { if (j.leadId === u.id) j.leadId = r.uid; j.techIds = j.techIds.map(x => x === u.id ? r.uid : x); saveJob(j); }); ui.editUser = null; toast("Password reset"); } catch(e){ toast(authErr(e)); } } });
    const rm = $("#e_rm"); if (rm) rm.onclick = () => confirmSheet({ title:`Remove ${esc(u.name)}?`, text:"They won't be able to sign in anywhere. Their past jobs stay on record.", ok:"Remove", danger:true, onOk: async () => { try { await updateDoc(doc(fdb, "users", u.id), { active:false }); ui.editUser = null; toast("Removed"); } catch(e){ toast(authErr(e)); } } }); }
  $("#t_add").onclick = async () => {
    const name = $("#t_name").value.trim(), user = cleanUser($("#t_user").value), pw = $("#t_pw").value, role = $("#t_role").value; const b = $("#t_add");
    if (!name || !user || pw.length < 6) { $("#t_err").textContent = "Name, username and a 6+ character password are required."; return; }
    if (DB.users.some(x => x.username === user && x.active !== false)) { $("#t_err").textContent = "That username is taken."; return; }
    b.disabled = true; $("#t_err").textContent = "";
    try { const r = await createCrewAccount(name, user, role, pw); const batch = writeBatch(fdb); batch.set(doc(fdb, "users", r.uid), { name, username:user, role, active:true, authEmail:r.email, createdAt:Date.now() }); batch.set(doc(fdb, "usernames", user), { uid:r.uid, authEmail:r.email, n:r.n }); await batch.commit(); toast(name + " added — they can sign in now"); }
    catch(e){ $("#t_err").textContent = authErr(e); b.disabled = false; }
  };
}

// ---------- settings ----------
async function exportBackup(){ const text = JSON.stringify({ v:3, users:DB.users, jobs:DB.jobs, exportedAt:Date.now() }); if (navigator.share) { try { await navigator.share({ title:"3X Job Board backup", text }); return; } catch(e){ if (e.name === "AbortError") return; } } copyText(text); }
function renderSettings(){
  const u = me();
  app.innerHTML = topbar("Settings", `Signed in as ${esc(u.name)}`, "") +
   `<div class="main"><div class="stack">
     <div class="card" style="padding:14px"><div class="stack"><div class="field"><label>Appearance</label><div class="seg">${["auto","light","dark"].map(t => `<button class="${DB.theme === t ? "on" : ""}" data-theme="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div><button class="btn ghost" id="signout">Sign out</button></div></div>
     <div class="sect-title"><h2>Data</h2></div>
     <div class="card" style="padding:14px"><div class="stack"><div style="color:var(--muted);font-size:13px">Jobs and accounts live in the shared 3X database and sync to every signed-in phone. Export a copy any time.</div>${isOwner() ? `<button class="btn ghost" id="reseed">Refresh client list from the master sheet</button>` : ""}<div class="grid2"><button class="btn" id="export">Export a copy</button>${localLegacy() && isOwner() ? `<button class="btn" id="import">Upload this phone's old jobs</button>` : `<button class="btn" disabled>Nothing to upload</button>`}</div></div></div>
     <div class="hint">3X Job Board v6.3 · synced · checklists rev 09/11/2026 · works offline once opened · add to Home Screen for full-screen use</div></div></div>`;
  wireNav(); app.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { DB.theme = b.dataset.theme; save(); applyTheme(); redraw(renderSettings); });
  $("#signout").onclick = () => fbSignOut(auth);
  $("#export").onclick = exportBackup;
  const im = $("#import"); if (im) im.onclick = offerLegacyUpload;
  const rs = $("#reseed"); if (rs) rs.onclick = async () => { rs.disabled = true; try { const n = await seedClients(); toast(n ? `Client list updated · ${n} change${n === 1 ? "" : "s"}` : "Client list already up to date"); } catch(e){ toast("Failed: " + (e.code || e.message)); } rs.disabled = false; };
}

// ---------- legacy upload (jobs stored on this phone before sync existed) ----------
function offerLegacyUpload(){
  const d = localLegacy(); if (!d) { toast("No old jobs on this phone"); return; }
  if (d.v === 1) migrateV1(d); if (d.v === 2) migrateV2(d);
  const already = new Set(DB.jobs.map(j => j.id)); const fresh = d.jobs.filter(j => !already.has(j.id));
  if (!fresh.length) { localStorage.removeItem(OLDKEY); toast("Those jobs are already uploaded"); return; }
  const meId = DB.session.userId; const oldUsers = d.users || [];
  confirmSheet({ title:"Upload this phone's jobs?", text:`${fresh.length} job${fresh.length === 1 ? "" : "s"} from before the sync existed. They'll be credited to you as lead where the old account can't be matched.`, ok:`Upload ${fresh.length} job${fresh.length === 1 ? "" : "s"}`, onOk: async () => {
    try { const batch = writeBatch(fdb); const mapU = id => { const o = oldUsers.find(u => u.id === id); const m = o && DB.users.find(u => u.username === o.username && u.active !== false); return m ? m.id : meId; };
      fresh.forEach(j => { j.leadId = mapU(j.leadId); j.techIds = (j.techIds || []).map(mapU).filter(x => x !== j.leadId); j.updatedAt = Date.now(); batch.set(doc(fdb, "jobs", j.id), JSON.parse(JSON.stringify(j))); });
      await batch.commit(); localStorage.removeItem(OLDKEY); toast(`Uploaded ${fresh.length} job${fresh.length === 1 ? "" : "s"}`); }
    catch(e){ toast("Upload failed: " + (e.code || e.message)); } } });
}

// ---------- live sync ----------
let unsubUsers = null, unsubJobs = null, unsubClients = null, pendingRemote = false;
function onRemote(){
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ($("#sheet") || typing) { pendingRemote = true; return; }
  pendingRemote = false;
  if (ui.screen === "job") redraw(renderJob);
  else if (ui.screen !== "newjob") render();
}
document.addEventListener("focusout", () => { if (pendingRemote) setTimeout(() => { if (pendingRemote && !$("#sheet")) onRemote(); }, 300); });
function subscribe(){
  unsubUsers = onSnapshot(collection(fdb, "users"), snap => { DB.users = snap.docs.map(d => ({ id:d.id, ...d.data() })); DB.usersReady = true; checkReady(); }, e => toast("Team sync error: " + e.code));
  unsubJobs = onSnapshot(query(collection(fdb, "jobs"), orderBy("createdAt")), snap => { DB.jobs = snap.docs.map(d => d.data()); DB.jobsReady = true; checkReady(); }, e => toast("Job sync error: " + e.code));
  unsubClients = onSnapshot(collection(fdb, "clients"), snap => { DB.clients = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name)); DB.clientsReady = true; if (!snap.metadata.fromCache && isOwner() && !DB.seeding && (!DB.clients.length || (DB.seedVersion || 0) < SEED_VERSION)) { DB.seeding = true; seedClients().then(n => { DB.seedVersion = SEED_VERSION; save(); if (n) toast(`Client list updated · ${n} client${n === 1 ? "" : "s"}`); }).catch(e => { DB.seeding = false; toast("Client list: " + (e.code || e.message)); }); } if (ui.screen === "newjob" && !$("#sheet")) redraw(renderNewJob); if ((ui.screen === "clients" || (ui.screen === "client" && !ui.clientEdit)) && !$("#sheet")) render(); }, e => toast("Client sync error: " + e.code));
}
function unsubscribe(){ if (unsubUsers) unsubUsers(); if (unsubJobs) unsubJobs(); if (unsubClients) unsubClients(); unsubUsers = unsubJobs = unsubClients = null; DB.users = []; DB.jobs = []; DB.clients = []; DB.usersReady = DB.jobsReady = DB.clientsReady = false; }
function checkReady(){
  if (!DB.usersReady) return;
  if (!DB.ready) { DB.ready = true; ui.screen = me() ? "home" : ui.screen; render(); }
  else onRemote();
  if (me() && isOwner() && localLegacy() && !DB.offeredLegacy) { DB.offeredLegacy = true; setTimeout(offerLegacyUpload, 800); }
}

// ---------- boot ----------
applyTheme(); renderSplash();
setPersistence(auth, browserLocalPersistence).catch(() => {});
onAuthStateChanged(auth, async user => {
  if (user) { DB.session = { userId:user.uid }; DB.ready = false; renderSplash("Loading your board…"); unsubscribe(); subscribe(); }
  else { unsubscribe(); DB.session = null; ui.screen = "login"; try { const s = await getDoc(doc(fdb, "meta", "setup")); DB.setupDone = s.exists(); } catch(e){ DB.setupDone = true; } DB.ready = true; render(); }
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => {});
window.__db = () => DB; window.__app = { go, render, ui, DB, animateScroll };
</script>
